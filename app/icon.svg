<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <!-- Fundo Dark (Você pode remover esta linha <rect> se quiser o logo com fundo transparente) -->
  <rect width="120" height="120" rx="28" fill="#0A0A0B"/>
  
  <!-- Grupo Centralizado -->
  <g transform="translate(19, 35)">
    <!-- Letra N -->
    <path d="M 5 50 V 0 L 30 50 V 0" 
          stroke="#FFFFFF" 
          stroke-width="10" 
          stroke-linecap="round" 
          stroke-linejoin="round" 
          fill="none" />
    
    <!-- Ponto (Tech Glow) -->
    <circle cx="44" cy="45" r="7" fill="#FF7657" />
    
    <!-- Letra E (Pilha de livros em perfil) -->
    <path d="M 74 0 H 55 V 50 H 77 M 55 25 H 70" 
          stroke="#FFFFFF" 
          stroke-width="10" 
          stroke-linecap="round" 
          stroke-linejoin="round" 
          fill="none" />
  </g>
</svg>
